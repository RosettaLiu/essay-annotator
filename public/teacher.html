<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教师批改</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>教师批改</h1>
    <a class="link-btn" href="index.html">← 首页</a>
  </header>

  <main class="teacher">
    <!-- 左：作文原文 -->
    <section class="pane essay-pane">
      <h2>作文原文</h2>
      <div id="essay" class="essay"></div>
    </section>

    <!-- 右：总体评价 + 批注 -->
    <section class="pane comment-pane">
      <h2>总体评价（可编辑）</h2>
      <div class="ov">
        <label>总体评价</label>
        <textarea id="ov-summary" rows="3"></textarea>
        <label>优点（每行一条）</label>
        <textarea id="ov-strengths" rows="3"></textarea>
        <label>主要问题（每行一条）</label>
        <textarea id="ov-problems" rows="3"></textarea>
        <label>下一步建议</label>
        <textarea id="ov-next" rows="2"></textarea>
      </div>

      <h2>批注（可编辑）</h2>
      <div id="comment-list"></div>

      <h2>新增批注</h2>
      <p class="hint">先在上方【作文原文】中选中一段文字，再点下面按钮可自动补齐片段与位置。</p>
      <button id="use-sel-btn" type="button" class="block">用选中文字新建批注</button>
      <form id="add-form" class="add-form">
        <input id="add-target" placeholder="原文片段（须与原文完全一致，或从选中文字自动补齐）" />
        <div class="inline">
          <select id="add-type">
            <option>错别字</option><option>病句</option><option>用词</option><option>标点</option>
            <option>句式/表达</option><option>逻辑</option><option>结构</option><option>内容</option><option>其他</option>
          </select>
          <select id="add-level">
            <option value="error">错误</option>
            <option value="suggestion">建议</option>
          </select>
        </div>
        <input id="add-sug" placeholder="修改建议" />
        <input id="add-rep" placeholder="修改后表达（可空）" />
        <textarea id="add-exp" rows="2" placeholder="解释"></textarea>
        <button type="submit" class="primary">新增批注</button>
      </form>

      <button id="share-btn" class="primary block">完成批改并生成分享链接</button>
      <div id="share-result"></div>
    </section>
  </main>

  <script src="render.js"></script>
  <script src="teacher.js"></script>
</body>
</html>
